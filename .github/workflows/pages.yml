name: Deploy homepage to GitHub Pages

on:
  push:
    branches: [main]
    paths:
      - "homepage/**"
      - "assets/WeightCode.pdf"
      - "assets/fig1.png"
      - ".github/workflows/pages.yml"
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v6
      # The site is homepage/ plus the two published assets the page links to (the paper PDF and Figure 1).
      - name: Assemble the site
        run: |
          mkdir -p _site/assets
          cp -r homepage/. _site/
          cp assets/WeightCode.pdf assets/fig1.png _site/assets/
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: _site
      - id: deployment
        uses: actions/deploy-pages@v4
