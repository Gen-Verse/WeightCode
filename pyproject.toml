[project]
name = "weightcode"
version = "0.0.1"
description = "WeightCode: installing new capabilities in trained networks with LLM-written weight programs"
license = "MIT"
license-files = ["LICENSE"]
requires-python = ">=3.12"
dependencies = ["numpy>=2.3"]

[project.scripts]
weightcode = "weightcode.application.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]
train = ["torch>=2.9", "torchvision>=0.24", "pillow>=13"]
# E14 (BabyAI): the versions of the wheels pinned in weightcode.data.e14.WHEELS.
e14 = ["minigrid==3.2.0", "gymnasium==1.4.0", "pygame-ce==2.5.8", "cloudpickle==3.1.2", "farama-notifications==0.0.6"]
# T03: native ImageNet evaluation.
t03 = ["pyarrow==26.0.1", "huggingface-hub==1.3.4"]
# Paper figures (built from the local Paper/ tree, which is not published): the versions the figures were built with.
figures = ["matplotlib==3.11.1", "fonttools==4.63.0"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["weightcode"]

[tool.hatch.build.targets.sdist]
include = ["/weightcode", "/skills", "/programs", "/scripts", "/tests", "/assets", "/README.md", "/LICENSE", "/pyproject.toml", "/uv.lock", "/.python-version", "/.gitignore"]

[tool.pytest.ini_options]
testpaths = ["tests"]
